<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | UE Portal</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: #f4f7f6;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
        border-top: 6px solid #2e6b3e; /* Green Theme Border */
      }

      .logo {
        width: 80px;
        margin-bottom: 20px;
      }

      h2 {
        color: #2e6b3e;
        margin-bottom: 10px;
        font-size: 24px;
      }

      p.subtitle {
        color: #666;
        font-size: 14px;
        margin-bottom: 25px;
      }

      label {
        display: block;
        text-align: left;
        font-weight: bold;
        margin-bottom: 8px;
        color: #333;
        font-size: 14px;
      }

      input[type="text"] {
        width: 100%;
        padding: 12px 15px;
        border: 1.5px solid #ddd;
        border-radius: 8px;
        outline: none;
        transition: all 0.3s ease;
        margin-bottom: 10px;
      }

      input[type="text"]:focus {
        border-color: #2e6b3e;
        box-shadow: 0 0 8px rgba(46, 107, 62, 0.1);
      }

      .btn-group {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }

      input[type="submit"],
      input[type="reset"] {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      input[type="submit"] {
        background: #2e6b3e;
        color: white;
      }

      input[type="submit"]:hover {
        background: #214f2e;
      }

      input[type="reset"] {
        background: #f0f0f0;
        color: #333;
      }

      input[type="reset"]:hover {
        background: #e0e0e0;
      }

      .back-link {
        display: inline-block;
        margin-top: 25px;
        color: #2e6b3e;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }

      .back-link:hover {
        text-decoration: none;
      }

      #forgotError,
      #forgotSuccess {
        font-size: 13px;
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 5px;
      }

      /* Responsive */
      @media (max-width: 480px) {
        .action-grid {
          grid-template-columns: 1fr;
        }

        .dash-btn.logout {
          grid-column: span 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="ue_logo.png" alt="University Logo" class="logo" />

      <h2>Reset Password</h2>
      <p class="subtitle">Enter your details to receive reset instructions.</p>

      <form action="forgot_password.php" method="post">
        <label for="forgot_id">Student Gmail</label>
        <input
          type="text"
          id="forgot_id"
          name="forgot_id"
          placeholder="@gmail.com"
          pattern="(^[a-z0-9._%+-]+@gmail\.com$)"
          title="Enter valid Gmail address"
          autocomplete="off"
          required
        />

        <div
          id="forgotError"
          style="color: #721c24; background: #f8d7da; display: none"
        >
          ⚠️ Please enter a valid Email!
        </div>

        <div
          id="forgotSuccess"
          style="color: #155724; background: #d4edda; display: none"
        >
          ✅ Reset link has been sent to your email.
        </div>

        <div class="btn-group">
          <input type="submit" value="Reset Password" />
          <input type="reset" value="Clear" onclick="hideMessages()" />
        </div>
      </form>

      <p>
        <a href="std_login.html" class="back-link">← Back to Login</a>
      </p>
    </div>

    <script>
      function validateForgot() {
        var id = document.getElementById("forgot_id").value;
        var error = document.getElementById("forgotError");
        var success = document.getElementById("forgotSuccess");

        if (id.trim() === "") {
          error.style.display = "block";
          success.style.display = "none";
          return false;
        }

        error.style.display = "none";
        success.style.display = "block";

        return false;
      }

      function hideMessages() {
        document.getElementById("forgotError").style.display = "none";
        document.getElementById("forgotSuccess").style.display = "none";
      }
    </script>
  </body>
</html>
