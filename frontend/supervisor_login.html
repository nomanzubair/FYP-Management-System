<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supervisor Login | UE Portal</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      
      .supervisor_login_container {
        background: white;
        width: 100%;
        max-width: 420px;
        padding: 35px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        border-top: 5px solid #2e6b3e;
      }

      
      .supervisor_login_container h2 {
        display: block; 
        text-align: center;
        color: #2e6b3e;
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 25px; 
        text-transform: uppercase;
      }


      .supervisor_login_container h2::before {
        content: "";
        width: 80px; 
        height: 80px;
        background: url("ue_logo.png") no-repeat center;
        background-size: contain;
        display: block; 
        margin: 0 auto 15px auto; 
        transition: transform 0.3s;
      }

      .supervisor_login_container h2:hover::before {
        transform: scale(1.1);
      }


      .input-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 15px;
      }

      .input-group label {
        font-size: 13px;
        font-weight: 600;
        color: #333;
        margin-bottom: 5px;
      }

      .input-group input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        outline: none;
        transition: border 0.3s;
      }

      .input-group input:focus {
        border-color: #2e6b3e;
      }


      .login-btn {
        width: 100%;
        background-color: #2e6b3e;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
      }

      .login-btn:hover {
        background-color: #1f4d2c;
      }

      /* Responsive */
      @media (max-width: 480px) {
        .action-grid {
          grid-template-columns: 1fr;
        }

        .dash-btn.logout {
          grid-column: span 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="supervisor_login_container">
      <h2>Supervisor Login</h2>
      <form action="supervisor_login.php" method="post">
        <div class="input-group">
          <label>Username</label>
          <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
          />
        </div>

        <div class="input-group">
          <label>Password</label>
          <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
          />
        </div>

        <button type="submit" class="login-btn">Login</button>
      </form>
    </div>
  </body>
</html>
